<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#101927}iframe{display:block;width:430px;height:880px;border:0;margin:auto}#status{position:fixed;bottom:0;left:0;background:#111d;color:#fff;font:12px Arial;padding:4px}</style><iframe id="app"></iframe><pre id="status">loading</pre><script>
const mode=location.hash.slice(1)||'home';
localStorage.setItem('runverse-player-name','Student');
localStorage.setItem('runverse-map',mode==='college'?'college':'school');
localStorage.setItem('runverse-character',mode==='college'?'female':'male');
const frame=document.getElementById('app'),status=document.getElementById('status');
frame.onload=()=>{
 const doc=frame.contentDocument;
 const timer=setInterval(()=>{
  const enter=doc.getElementById('btn-enter');
  if(!enter||enter.disabled){status.textContent='waiting '+(doc.getElementById('splash-status-text')?.textContent||'');return;}
  clearInterval(timer);enter.click();
  setTimeout(()=>{
   if(['maps','settings','characters'].includes(mode))doc.querySelector(`[data-hub="${mode}"]`)?.click();
   status.textContent=JSON.stringify({mode,classes:doc.querySelector('.game')?.className,home:doc.getElementById('select-screen')?.getBoundingClientRect().width,hero:doc.getElementById('start')?.disabled,map:doc.getElementById('hub-map-name')?.textContent});
  },800);
 },200);
};
frame.src='./index.html';
</script>
