name: Build Android APK and Live Updates

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LMSK LifeRush APK & Live Updates
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Run automated test suite
        run: npm test

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../LMSK-LifeRush.apk

      - name: Create Web Bundle Zip for Live Updates
        run: |
          cd dist
          zip -r ../dist-bundle.zip .
          cd ..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMSK-LifeRush-Android-APK
          path: LMSK-LifeRush.apk
          retention-days: 30

      - name: Upload Live Update Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMSK-LifeRush-WebBundle
          path: dist-bundle.zip
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: LMSK LifeRush Latest (Live Updates & APK)
          draft: false
          prerelease: false
          files: |
            LMSK-LifeRush.apk
            dist-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
